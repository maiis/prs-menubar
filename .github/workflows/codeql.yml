name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        language: [swift, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Xcode
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # The Xcode project uses synchronized folders (objectVersion 77), which
      # CodeQL's autobuilder cannot see, so build manually.
      - name: Build
        if: matrix.language == 'swift'
        run: |
          xcodebuild -project "PRs MenuBar.xcodeproj" \
            -scheme "PRs MenuBar" \
            -configuration Release \
            -destination 'platform=macOS' \
            build CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
